# Challenge descriptions
vulnerable-verapdf-components.challenge.title=Challenge 1: Exploit XML Policy Processing
vulnerable-verapdf-components.challenge.description=A PDF validation system processes custom XSLT policies for document checking. Can you discover if the policy processor has unsafe behaviors?
vulnerable-verapdf-components.challenge.objective=Craft a malicious XSLT policy that demonstrates how the processor handles namespace extensions and Java method invocation.

# Hints for CTF style
vulnerable-verapdf-components.hint1=XSLT is more than just XML transformation. What namespaces can extend its functionality?
vulnerable-verapdf-components.hint2=Java classes can be accessed through special XML namespace URIs in Xalan XSLT processor.
vulnerable-verapdf-components.hint3=Runtime.getRuntime() can execute system commands. Can XSLT invoke it?
vulnerable-verapdf-components.hint4=Think about namespace declarations like xmlns:rt="http://xml.apache.org/xalan/java/java.lang.Runtime"

# Research
vulnerable-verapdf-components.research.tip=Look for XSLT namespace extensions, Xalan Java method invocation, and runtime command execution patterns.