<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/ossverapdfcorejakarta/documentation/VulnerableVeraPdfcomponents_plan.adoc}"></div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/ossverapdfcorejakarta/documentation/VulnerableVeraPdfcomponents_content0.adoc}"></div>
    </div>

    <!-- Challenge: Document Policy Evaluation -->
    <div class="lesson-page-wrapper">
        <div class="attack-container">
            <div class="assignment-success">
                <i class="fa fa-2 fa-check hidden" aria-hidden="true"></i>
            </div>

            <form class="attack-form" accept-charset="UTF-8" method="POST" name="attackForm"
                  action="documents/policy-check" id="policyCheckForm">

                <div id="lessonContent">
                    <div class="input-section">

                        <table class="input-table">
                            <tr>
                                <td><strong>Policy Document:</strong></td>
                                <td>
                                    <textarea
                                        id="policyDocumentField"
                                        name="policyDocument"
                                        rows="8"
                                        cols="75"
                                        placeholder="Paste your document policy here..."
                                    ></textarea>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Document ID:</strong></td>
                                <td>
                                    <input type="text" name="documentId"
                                           placeholder="optional reference" style="width:200px"/>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Output Format:</strong></td>
                                <td>
                                    <select name="outputFormat">
                                        <option value="json">JSON</option>
                                        <option value="xml">XML</option>
                                        <option value="text">Plain Text</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td><strong>Validate Schema:</strong></td>
                                <td>
                                    <input type="checkbox" id="validateSchemaBox"
                                           name="validateSchema" value="true"/>
                                    <label for="validateSchemaBox">Apply schema validation pass</label>
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2">
                                    <input name="SUBMIT" value="Submit Policy" type="SUBMIT"/>
                                </td>
                            </tr>
                        </table>

                    </div>
                </div>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

    <!-- Decoy: Policy History -->
    <div class="lesson-page-wrapper">
        <div class="attack-container">
            <form class="attack-form" accept-charset="UTF-8" method="POST" name="historyForm"
                  action="documents/policy-history" id="policyHistoryForm">
                <p><strong>Retrieve Policy History</strong></p>
                <p>Document ID:</p>
                <input type="text" name="documentId" placeholder="optional reference"
                       style="width:200px"/><br/><br/>
                <select name="outputFormat">
                    <option value="json">JSON</option>
                    <option value="xml">XML</option>
                </select><br/><br/>
                <input name="SUBMIT" value="Retrieve History" type="SUBMIT"/>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

</html>
