# Challenge descriptions
vulnerable-itextpdf-io-components.challenge.title=Challenge 1: Exploit File Path Injection
vulnerable-itextpdf-io-components.challenge.description=A PDF comparison system processes file paths for validation. Can you discover if the file path processor has unsafe behaviors?
vulnerable-itextpdf-io-components.challenge.objective=Craft malicious file paths that demonstrate how the processor handles unvalidated input and command injection.

# Hints for CTF style
vulnerable-itextpdf-io-components.hint1=File paths can include special characters. What happens if you inject additional parameters?
vulnerable-itextpdf-io-components.hint2=Command injection often involves escape sequences. Can you use them in file paths?
vulnerable-itextpdf-io-components.hint3=The CompareTool class uses file paths in system commands. Can you manipulate those commands?
vulnerable-itextpdf-io-components.hint4=Think about how file paths are passed to the system. Are they sanitized?

# Research
vulnerable-itextpdf-io-components.research.tip=Look for command injection patterns, file path validation issues, and how CompareTool processes input.