<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/ossitextpdfio/documentation/VulnerableITextPdfIOcomponents_plan.adoc}"></div>
    </div>

    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/ossitextpdfio/documentation/VulnerableITextPdfIOcomponents_content0.adoc}"></div>
    </div>

    <!-- Document Comparison -->
    <div class="lesson-page-wrapper">
        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>

            <form class="attack-form" method="POST" action="documents/compare" id="docCompareForm">
                <div class="input-section">
                    <p><strong>Document Comparison</strong></p>

                    <p>Source Document:</p>
                    <input
                        type="text"
                        id="sourceRef"
                        name="sourceRef"
                        placeholder="e.g. reports/baseline.pdf"
                        size="60"
                    /><br/><br/>

                    <p>Target Document:</p>
                    <input
                        type="text"
                        id="targetRef"
                        name="targetRef"
                        placeholder="e.g. reports/current.pdf"
                        size="60"
                    /><br/><br/>

                    <p>Output Format:</p>
                    <select name="outputFormat">
                        <option value="json">JSON</option>
                        <option value="xml">XML</option>
                        <option value="text">Plain Text</option>
                    </select><br/><br/>

                    <p>Difference Threshold:</p>
                    <input type="text" name="diffThreshold" value="0"
                           placeholder="0" style="width:60px"/><br/><br/>

                    <input name="submit" value="Compare Documents" type="submit"/>
                </div>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

    <!-- Decoy: Comparison Report -->
    <div class="lesson-page-wrapper">
        <div class="attack-container">
            <form class="attack-form" method="POST" action="documents/compare-report" id="compareReportForm">
                <p><strong>Retrieve Comparison Report</strong></p>
                <p>Source Document:</p>
                <input type="text" name="sourceRef" placeholder="e.g. reports/baseline.pdf"
                       size="60"/><br/><br/>
                <p>Target Document:</p>
                <input type="text" name="targetRef" placeholder="e.g. reports/current.pdf"
                       size="60"/><br/><br/>
                <select name="outputFormat">
                    <option value="json">JSON</option>
                    <option value="xml">XML</option>
                </select><br/><br/>
                <input name="submit" value="Get Report" type="submit"/>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>
</body>
</html>
