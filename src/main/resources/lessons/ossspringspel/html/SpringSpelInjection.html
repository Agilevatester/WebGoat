<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

    <!-- Page 1: SpEL Concept Introduction -->
    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/ossspringspel/documentation/spel-intro.adoc}"></div>
    </div>

    <!-- Page 2: Challenge Exercise -->
    <div class="lesson-page-wrapper">
        <div class="adoc-content" th:replace="~{doc:lessons/ossspringspel/documentation/spel-exercise.adoc}"></div>

        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>

            <script th:src="@{/lesson_js/spel.js}" type="text/javascript"></script>


            <!-- Employee Performance Review Search Form
                 Multiple parameters — only one is vulnerable. Students must identify it. -->
            <form class="attack-form" accept-charset="UNKNOWN" id="spel-search-form"
                  method="POST" name="form"
                  successCallback="onSpelSearchResponse"
                  action="SpringSpelInjection/review-search">

                <h5>Employee Performance Review Search</h5>

                <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:12px;">
                    <div>
                        <label>Employee ID</label><br/>
                        <input name="employeeId" type="text" value="EMP-1042"
                               style="width:120px" />
                    </div>
                    <div>
                        <label>Review Year</label><br/>
                        <input name="reviewYear" type="text" value="2024"
                               style="width:80px" />
                    </div>
                    <div>
                        <label>Department</label><br/>
                        <input name="department" type="text" value="Engineering"
                               style="width:130px" />
                    </div>
                    <div>
                        <label>Output View</label><br/>
                        <input name="outputView" type="text" value="summary"
                               style="width:200px" placeholder="summary / detailed / compact" />
                    </div>
                </div>

                <input name="submit" value="Search Reviews" type="submit"/>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output" style="font-family:monospace; white-space:pre-wrap;"></div>

            <hr style="margin:20px 0"/>

            <!-- Token submission form — the assignment endpoint -->
            <form class="attack-form" accept-charset="UNKNOWN" id="spel-token-form"
                  method="POST" name="form"
                  successCallback="onSpelTokenResponse"
                  action="SpringSpelInjection/submit-token">

                <h5>Submit Challenge Token</h5>
                <p>Once you have exfiltrated the server-side token via SpEL injection, enter it here:</p>
                <input name="token" type="text" placeholder="e.g. A3F9B1C2D4E5"
                       style="width:220px; font-family:monospace; letter-spacing:1px;" /><br/><br/>
                <input name="submit" value="Submit Token" type="submit"/>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

</html>
