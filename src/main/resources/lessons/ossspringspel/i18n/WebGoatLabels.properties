spring-spel-injection.title=Spring SpEL Injection

# --- Search endpoint feedback ---
# (no i18n keys needed for search — feedback is returned as dynamic output strings)

# --- Token submission feedback ---
spel-injection.token-empty=Please enter the token you obtained via SpEL injection.
spel-injection.wrong-token=That token is incorrect. Make sure you are calling the right method on the server and submitting the exact value returned.
spel-injection.success=Excellent! You successfully injected a SpEL expression, executed server-side Java code, and exfiltrated the challenge token — proving Remote Code Execution. In a real application this could mean full server compromise.

# --- Hints (progressively more specific) ---
spel-injection.hint.1=One of the four form fields is evaluated as a SpEL expression by the server. Try submitting a simple arithmetic expression (like 2*3) in each field and observe whether the output reflects the computed value rather than the literal string.
spel-injection.hint.2=Once you have identified the vulnerable field, use the T() operator to access Java classes. T(java.lang.System).getProperty('os.name') is a safe starting point that returns the server OS without executing commands.
spel-injection.hint.3=To get the challenge token, you need to call a static method on a class in the org.owasp.webgoat.lessons.ossspringspel package. Think about which class in the lesson would hold the token and what a method that returns it might be named.
spel-injection.hint.4=The full SpEL payload follows the pattern: T(fully.qualified.ClassName).methodName(). Combine what you know about the lesson package, the endpoint class name, and a method that returns a String token. Submit the returned value — not the expression itself — in the token form.
