    <!-- Integration Route Data -->
    <div class="lesson-page-wrapper">
        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>

            <form class="attack-form" accept-charset="UNKNOWN" method="POST" name="form"
                  action="integration/route-data" id="routeDataForm">
                <div id="lessonContent">
                    <p><strong>Route Data Processing</strong></p>

                    <p>Route Name:</p>
                    <input type="text" name="routeName" placeholder="optional"
                           style="width:200px"/><br/><br/>

                    <p>Engine ID:</p>
                    <input type="text" name="engineId" placeholder="optional"
                           style="width:200px"/><br/><br/>

                    <p>Route Data:</p>
                    <textarea name="routeData" rows="10" cols="80"
                              placeholder="Paste route data document here..."></textarea><br/><br/>

                    <input name="SUBMIT" value="Process Route Data" type="SUBMIT"/>
                </div>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>
