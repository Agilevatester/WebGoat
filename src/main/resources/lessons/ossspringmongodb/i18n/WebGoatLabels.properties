# Challenge descriptions
vulnerable-spring-mongodb-components.challenge.title=Challenge 1: Exploit SpEL Injection in MongoDB Queries
vulnerable-spring-mongodb-components.challenge.description=A Spring Data MongoDB application uses @Query with SpEL expressions. Can you discover if user input is safely validated?
vulnerable-spring-mongodb-components.challenge.objective=Craft a SpEL expression that demonstrates code execution through parameter substitution in @Query annotations.

# Hints for CTF style
vulnerable-spring-mongodb-components.hint1=Spring Expression Language (SpEL) is more powerful than simple string substitution. What operators does it support?
vulnerable-spring-mongodb-components.hint2=The T() operator in SpEL allows accessing Java classes. Which classes have dangerous methods?
vulnerable-spring-mongodb-components.hint3=java.lang.Runtime.getRuntime() can execute system commands. Can SpEL invoke it?
vulnerable-spring-mongodb-components.hint4=Think about expressions like T(java.lang.Runtime).getRuntime().exec(new String[]{'command'})

# Research
vulnerable-spring-mongodb-components.research.tip=Look for SpEL T() operators, Java class instantiation, Runtime.exec() patterns, and ProcessBuilder usage in expressions.