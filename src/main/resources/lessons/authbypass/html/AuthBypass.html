                <input type="hidden" name="userId" value="12309746" />

                <input name="submit" value="Submit" type="submit"/>

            </form>

                <p>Confirm Password:</p>

                <input name="submit" value="Submit" type="submit"/>

            <div class="attack-output"></div>

    <!-- =====================================================================
         Exercise: MFA State Skip
         ===================================================================== -->
    <div class="lesson-page-wrapper">
             <script th:src="@{/lesson_js/bypass.js}" />
        <div class="adoc-content" th:replace="~{doc:lessons/authbypass/documentation/exercise-mfa-state-skip.adoc}"></div>
        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>

            <!-- Step 1: submit credentials -->
            <form class="attack-form" accept-charset="UNKNOWN" id="mfa-step1-form"
                  method="POST" name="form"
                  prepareData="prepareMfaStep1Json"
                  contentType="application/json; charset=UTF-8"
                  failureCallback="onMfaStep1Response"
                  action="auth-bypass/mfa/credentials">
                <p><strong>Step 1 — Enter credentials</strong></p>
                <p>Username:</p>
                <input name="username" value="" type="text" placeholder="admin" /><br/>
                <p>Password:</p>
                <input name="password" value="" type="password" placeholder="password" /><br/><br/>
                <input name="submit" value="Submit Credentials" type="submit"/>
            </form>

            <!-- Step 2: OTP verification (normal flow) — hidden until step 1 done -->
            <form class="attack-form" accept-charset="UNKNOWN" id="mfa-otp-form"
                  method="POST" name="form"
                  prepareData="prepareMfaOtpJson"
                  contentType="application/json; charset=UTF-8"
                  failureCallback="onMfaOtpResponse"
                  action="auth-bypass/mfa/otp-verify"
                  style="display:none">
                <p><strong>Step 2 — Enter OTP</strong></p>
                <p>Use the OTP sent to your device to complete verification.</p>
                <input name="otp" value="" type="text" placeholder="Enter 6-digit OTP" /><br/><br/>
                <input name="submit" value="Verify OTP" type="submit"/>
            </form>

            <!-- Step 3: access protected resource -->
            <form class="attack-form" accept-charset="UNKNOWN" id="mfa-access-form"
                  method="POST" name="form"
                  prepareData="prepareMfaAccessJson"
                  contentType="application/json; charset=UTF-8"
                  successCallback="onMfaAccessResponse"
                  action="auth-bypass/mfa/access"
                  style="display:none">
                <p><strong>Step 3 — Access Protected Resource</strong></p>
                <p>Proceed to access the protected resource after completing your authentication steps.</p><br/>
                <input name="submit" value="Access Protected Resource" type="submit"/>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>
