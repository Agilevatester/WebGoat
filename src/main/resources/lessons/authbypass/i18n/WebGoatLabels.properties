auth-bypass.title=Authentication Bypasses

verify-account.cheated=It appears you may be using source code to cheat.While that's always helpful when hacking. Please try again.
verify-account.failed=Not quite, please try again.
verify-account.success=Congrats, you have successfully verified the account without actually verifying it. You can now change your password!

auth-bypass.hints.verify.1=The attack on this is similar to the story referenced, but not exactly the same.
auth-bypass.hints.verify.2=You do want to tamper the  security  question parameters, but not delete them
auth-bypass.hints.verify.3=The logic to verify the account does expect 2 security questions to be answered, but there is a flaw in the implementation
auth-bypass.hints.verify.4=Have you tried renaming the secQuestion0 and secQuestion1 parameters?

auth-bypass.2fa.cheated=You supplied the correct OTP — but the goal is to bypass verification without it. Intercept the request and try removing the code parameter entirely.
auth-bypass.2fa.failed=Incorrect 2FA code. Try a different approach — inspect the HTTP request in your browser's Network tab or a proxy.
auth-bypass.2fa.success=Excellent! You bypassed 2FA by omitting the code parameter. The server only validates it when present — a classic parameter omission vulnerability.

auth-bypass.hints.2fa.1=This is similar to the PayPal bypass — what did the researcher do with the security question parameters?
auth-bypass.hints.2fa.2=Use your browser's Developer Tools (Network tab) or an intercepting proxy to inspect the POST request body.
auth-bypass.hints.2fa.3=What happens if you submit the form without the code parameter? Remove it from the request before it reaches the server.

# --- Missing Auth Check (CVE-2024-4358 / Telerik style) ---
auth-bypass.missing-auth.success=Congratulations! You escalated your own privileges to admin by exploiting the missing authorisation check on the registration endpoint. This mirrors CVE-2024-4358 (Telerik Report Server).
auth-bypass.missing-auth.not-admin=You registered as a normal user. The server accepted your registration but the goal is to register as admin. Inspect the form's hidden fields.

auth-bypass.hints.missing-auth.1=Open Developer Tools (F12) and inspect the HTML source of the registration form. Look for hidden input fields.
auth-bypass.hints.missing-auth.2=Find the hidden 'role' field in the form. You can edit it directly in the Elements tab before submitting, or intercept the POST in the Network tab.
auth-bypass.hints.missing-auth.3=Change the value of the hidden 'role' field from 'user' to 'admin' and resubmit the form.

# --- Rate-Limit Bypass (EDB-49037 / Bludit style) ---
auth-bypass.ratelimit.locked=Your IP has been locked after too many failed attempts. Add an X-Forwarded-For header with a new IP address to reset your attempt counter.
auth-bypass.ratelimit.failed=Invalid credentials. Try logging in with wrong credentials until you are locked, then bypass the rate limit using the X-Forwarded-For header.
auth-bypass.ratelimit.success=Excellent! You bypassed IP-based rate limiting by spoofing the X-Forwarded-For header. This is the technique used in EDB-49037 (Bludit CMS).

auth-bypass.hints.ratelimit.1=Submit the form with wrong credentials 3 times. What error message do you get after the third failure?
auth-bypass.hints.ratelimit.2=Research the X-Forwarded-For HTTP header. Which IP does the server use when this header is present?
auth-bypass.hints.ratelimit.3=Use DevTools (Network tab → Edit & Resend) or a proxy to add the header 'X-Forwarded-For: 10.0.0.1'. Then log in with admin / tomcat.

# --- Path-Based Auth Bypass (CVE-2024-27198 / TeamCity style) ---
auth-bypass.path.empty=Please enter a resource path.
auth-bypass.path.blocked=The security filter blocked your direct request to /admin. Try a path variant that looks different to the filter but resolves to the same resource.
auth-bypass.path.not-admin=That path did not resolve to /admin. Check the output for the resolved value and try a different bypass technique.
auth-bypass.path.success=Congratulations! Your crafted path bypassed the WAF filter and resolved to /admin on the server. This mirrors the root cause of CVE-2024-27198 (JetBrains TeamCity).

auth-bypass.hints.path.1=The WAF uses exact string equality to block /admin. What input looks different as a raw string but is equivalent to /admin after server-side normalisation?
auth-bypass.hints.path.2=In URLs, a semicolon introduces a path parameter (RFC 2396). For example, /path;ignored is often normalised to /path by the server's routing layer.
auth-bypass.hints.path.3=Try submitting '/admin;.css', '//admin', or '/%61dmin'. One of these will pass the WAF's exact-match check while still resolving to /admin.

# --- MFA State Skip (DeepStrike Technique 1) ---
mfa-state-skip.step1-done=Password accepted. A one-time code has been sent to your registered device. Skip the OTP step and click 'Access Protected Resource' to demonstrate the bypass.
mfa-state-skip.bad-credentials=Invalid username or password. Use admin / admin123.
mfa-state-skip.step1-required=Complete Step 1 (credential verification) before attempting to access the protected resource.
mfa-state-skip.otp-invalid=Invalid OTP. Try again, or test whether Step 3 actually enforces OTP completion.
mfa-state-skip.otp-accepted=OTP accepted. Now proceed to Step 3.
mfa-state-skip.success=Excellent! You accessed the protected resource by skipping the OTP step entirely. The server checked the password factor but never verified the OTP factor — a classic MFA state-skip vulnerability (DeepStrike Technique 1).

auth-bypass.hints.mfa-state-skip.1=First submit the credentials form (Step 1). The server marks your session as 'password-factor complete' but does NOT yet require the OTP.
auth-bypass.hints.mfa-state-skip.2=Notice that the 'Access Protected Resource' button appears after Step 1. The server's protected-resource endpoint never checks whether the OTP was completed.
auth-bypass.hints.mfa-state-skip.3=Click 'Access Protected Resource' without entering any OTP. A correctly implemented Spring Security 7 MFA flow would reject this using FactorGrantedAuthority checks.

# --- MFA OTP Leakage in Response (DeepStrike Technique 2) ---
mfa-otp-leak.sent=A one-time code has been dispatched to the registered email address. Check the HTTP response for any debug information.
mfa-otp-leak.not-generated=You must request an OTP first. Click 'Send OTP' before attempting to verify.
mfa-otp-leak.wrong=Incorrect OTP. Inspect the network response from the 'Send OTP' request more carefully.
mfa-otp-leak.success=Excellent! You retrieved the OTP from the HTTP response debug comment and used it to authenticate. This is DeepStrike Technique 2 — OTP Leakage in HTTP Response. In a correct Spring Security 7 implementation, the OneTimeTokenGenerationSuccessHandler must never include the token in the response body.

auth-bypass.hints.mfa-otp-leak.1=Open Developer Tools (F12), click the Network tab, and then click 'Send OTP'. Select the request and read the full response body.
auth-bypass.hints.mfa-otp-leak.2=Look at the 'output' field in the JSON response. Does it contain any embedded values that shouldn't be visible?
auth-bypass.hints.mfa-otp-leak.3=Find the value after 'DEBUG otp_value=' in the response output. Enter that 4-digit number in the OTP verification form.

# --- Brute Force / No Rate Limiting (Technique 3) ---
mfa-bruteforce.wrong=Incorrect OTP — and no lockout was triggered! Try again as many times as you like.
mfa-bruteforce.success=Excellent! You found the OTP by exploiting the absence of rate limiting. Technique 3 complete. A correct implementation locks the OTP after 3-5 failed attempts.

auth-bypass.hints.mfa-bruteforce.1=The OTP is a 4-digit number (0000-9999). The endpoint has no rate limiting — it accepts every submission without penalty.
auth-bypass.hints.mfa-bruteforce.2=Use Burp Suite Intruder (Sniper attack, numeric payload 0000-9999) or a curl loop to automate the guessing. Filter by response body for 'lessonCompleted:true'.
auth-bypass.hints.mfa-bruteforce.3=The OTP for this exercise is 7528.

# --- Recovery Flow Bypass (Technique 4) ---
mfa-recovery.bad-creds=Invalid credentials. Try admin / adminpass.
mfa-recovery.step1-done=Credentials accepted. A 6-digit OTP has been sent to the registered device. You cannot access this device. Look for an alternative path.
mfa-recovery.step1-required=Complete Step 1 (credential submission) first.
mfa-recovery.wrong-otp=Incorrect OTP. You cannot access the device. Find an alternative way to authenticate.
mfa-recovery.normal-success=You completed the normal MFA flow. The lesson goal is to bypass MFA via the recovery path instead.
mfa-recovery.wrong-email=No account found for that email. Try the registered account email address.
mfa-recovery.bypass-success=Excellent! You bypassed MFA by using the account recovery path with just an email address. Technique 4 complete. The recovery endpoint granted full access without any second-factor verification.

auth-bypass.hints.mfa-recovery.1=The normal login flow requires an OTP you cannot obtain. Look for an alternative authentication path mentioned in the server response.
auth-bypass.hints.mfa-recovery.2=The application has a separate account recovery endpoint. Inspect the exercise documentation and the Step 1 response output for clues about where it is.
auth-bypass.hints.mfa-recovery.3=POST to auth-bypass/mfa/account-recovery with the parameter email=admin@webgoat.org to bypass MFA via the recovery path.

# --- Backup Code Abuse (Technique 5) ---
mfa-backup.codes-revealed=Your backup codes are shown in the output below. No step-up authentication was required to view them.
mfa-backup.wrong=That backup code is not valid. Have you clicked 'Reveal Backup Codes' first?
mfa-backup.success=Excellent! You retrieved plaintext backup codes from an unauthenticated endpoint and used one to log in. Technique 5 complete. Backup codes must be hashed, single-use, and protected by step-up authentication.

auth-bypass.hints.mfa-backup.1=Click 'Reveal Backup Codes'. Notice that the server returns them without asking you to re-authenticate — no step-up auth is required.
auth-bypass.hints.mfa-backup.2=Read the backup codes from the output section. Each code follows the format WGAT-XXXX.
auth-bypass.hints.mfa-backup.3=Enter one of the revealed codes (e.g. WGAT-7291) in the 'Login with Backup Code' form and submit.

# --- Client-Side Trust / Parameter Injection (Technique 10) ---
mfa-client-trust.bad-creds=Invalid credentials. Use admin / password123.
mfa-client-trust.need-mfa=Credentials accepted, but MFA verification is required. The form contains a hidden field that controls this check — find it and change its value.
mfa-client-trust.success=Excellent! You bypassed MFA by changing the hidden 'mfaVerified' field from 'false' to 'true'. Technique 10 complete. The server must never trust client-supplied authentication state — OTP verification must happen entirely server-side.

auth-bypass.hints.mfa-client-trust.1=Submit the login form once with correct credentials. Read the feedback carefully — it mentions a hidden field in the form that controls MFA verification.
auth-bypass.hints.mfa-client-trust.2=Open DevTools (F12) → Elements tab. Find the hidden input named 'mfaVerified' with value 'false'. Double-click the value to edit it.
auth-bypass.hints.mfa-client-trust.3=Change the hidden field value from 'false' to 'true' and resubmit the form, or intercept the POST and edit mfaVerified=false to mfaVerified=true in the request body.

# --- OAuth Account Linking Pitfall (Technique 9) ---
oauth-link.missing-identity=Please enter a WebWolf identity (your OAuth username).
oauth-link.missing-userid=Please enter the target User ID to link this identity to.
oauth-link.linked=Identity linked successfully. The server accepted your userId without checking the current session — the vulnerability is complete. Now use the OAuth Login form to log in via the linked identity.
oauth-link.not-linked=No link found for that WebWolf identity. Use the 'Complete Link' form first with the same WebWolf username.
oauth-link.wrong-account=That identity is not linked to the admin account. In the Complete Link form, set userId=admin and resubmit.
oauth-link.success=Excellent! You exploited the OAuth Account Linking Pitfall (Technique 9). By supplying userId=admin as a request parameter you linked your WebWolf identity to the admin account, then authenticated as admin via OAuth — without ever knowing the admin password or OTP.

auth-bypass.hints.oauth-link.1=The 'Complete Link' form has a 'Target User ID' field. This field should not be editable by the client — but it is. What happens if you enter 'admin' there?
auth-bypass.hints.oauth-link.2=In Step 1, set webwolfUsername to any value (e.g. 'hacker') and userId to 'admin', then submit. The server links your chosen identity to the admin account.
auth-bypass.hints.oauth-link.3=In Step 2, enter the same webwolfUsername you used in Step 1 (e.g. 'hacker') and click 'OAuth Login'. The server will find that this identity is linked to admin and grant access.
