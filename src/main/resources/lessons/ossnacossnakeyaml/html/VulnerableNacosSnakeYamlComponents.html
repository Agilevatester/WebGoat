    <!-- Configuration Sync -->
    <div class="lesson-page-wrapper">
        <div class="attack-container">
            <div class="assignment-success"><i class="fa fa-2 fa-check hidden" aria-hidden="true"></i></div>

            <form class="attack-form" accept-charset="UNKNOWN" method="POST" name="form"
                  action="config/sync" id="configSyncForm">
                <div id="lessonContent">
                    <p><strong>Configuration Sync</strong></p>

                    <p>Namespace:</p>
                    <input type="text" name="namespace" value="public"
                           placeholder="e.g. public" style="width:180px"/><br/><br/>

                    <p>Group:</p>
                    <input type="text" name="group" value="DEFAULT_GROUP"
                           placeholder="e.g. DEFAULT_GROUP" style="width:180px"/><br/><br/>

                    <p>Configuration Document:</p>
                    <textarea name="configBody" rows="10" cols="80"
                              placeholder="Paste configuration content here..."></textarea><br/><br/>

                    <input name="SUBMIT" value="Sync Configuration" type="SUBMIT"/>
                </div>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

    <!-- Decoy: Configuration Diff -->
    <div class="lesson-page-wrapper">
        <div class="attack-container">
            <form class="attack-form" accept-charset="UNKNOWN" method="POST" name="form"
                  action="config/diff" id="configDiffForm">
                <p><strong>Configuration Diff</strong></p>

                <p>Namespace:</p>
                <input type="text" name="namespace" value="public"
                       placeholder="e.g. public" style="width:180px"/><br/><br/>

                <p>Group:</p>
                <input type="text" name="group" value="DEFAULT_GROUP"
                       placeholder="e.g. DEFAULT_GROUP" style="width:180px"/><br/><br/>

                <p>Configuration Document:</p>
                <textarea name="configBody" rows="6" cols="80"
                          placeholder="Paste configuration to diff against stored version..."></textarea><br/><br/>

                <input name="SUBMIT" value="Run Diff" type="SUBMIT"/>
            </form>

            <div class="attack-feedback"></div>
            <div class="attack-output"></div>
        </div>
    </div>

    <div class="lesson-page-wrapper">
