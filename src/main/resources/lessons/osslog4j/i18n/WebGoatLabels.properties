# Challenge descriptions
vulnerable-log4j-components.challenge.title=Challenge 1: Find the Log4j Weakness
vulnerable-log4j-components.challenge.description=A developer integrated a logging library to monitor API requests. Can you discover if the logging mechanism has unintended side effects?
vulnerable-log4j-components.challenge.objective=Craft a special request that demonstrates how the logging system processes message interpolation patterns.

# Hints for CTF style
vulnerable-log4j-components.hint1=What if text contained special syntax like ${ ... }?
vulnerable-log4j-components.hint2=What could a logging library do with nested instructions?
vulnerable-log4j-components.hint3=Could it reach out to external services? (Think JNDI...)
vulnerable-log4j-components.hint4=What about combining protocols like ldap:// ?

# Research
vulnerable-log4j-components.research.tip=Look for patterns involving message interpolation syntax, JNDI protocols, and directory services like LDAP.